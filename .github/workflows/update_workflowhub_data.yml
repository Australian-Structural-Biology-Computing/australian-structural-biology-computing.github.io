name: Update WorkflowHub data

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out website
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Update WorkflowHub data
        run: python scripts/workflowhub_finder.py --config _config.yml

      - name: Show changes
        run: git diff --stat

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: _data/data_workflows.yaml
          commit-message: Update WorkflowHub workflow data
          branch: automation/update-workflowhub-data
          base: ${{ github.ref_name }}
          delete-branch: true
          title: Update WorkflowHub workflow data
          body: |
            Manual refresh of the ASBC community workflows from WorkflowHub.

            Please review the generated workflow metadata before merging.
