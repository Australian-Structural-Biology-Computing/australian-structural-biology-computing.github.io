{%- if include.yaml -%}
  {%- assign tiles = site.data.tiles[include.target] -%}
{%- else -%}
  {%- assign tiles = page[include.target] -%}
{%- endif -%}

<div class="row row-cols-1 row-cols-md-2 row-cols-lg-{{ include.col | default: 2 }} g-4 mb-5 navigation-tiles">
  {%- for item in tiles -%}
    {%- if item.title -%}
    <div class="col">
      {% include navigation-tile-card.html tile_page=item variant="section" %}
    </div>
    {%- endif -%}
  {%- endfor -%}
</div>
